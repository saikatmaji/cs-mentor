<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Mentor</title>

  <link rel="stylesheet" href="./src/style.css">

  <link rel="stylesheet" href="./main.css">

  <!-- font awesome link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="text-slate-900 min-h-screen relative text-sm sm:text-base">

  <!-- header section -->
  <header class="flex justify-between gap-8 p-8 max-w-[1000px] mx-auto w-full">
    <h1 class="text-2xl sm:text-3xl md:text-4xl">CS Mentor</h1>
    <a href="#services"><button class="card-button-secondary px-4 py-2 rounded-full whitespace-nowrap opacity-0 pointer-events-none">Enquire Now</button></a>
    <div class="fixed top-8 right-8">
      <a href="#services"><button class="card-button-secondary px-4 py-2 rounded-full whitespace-nowrap">Enquire Now</button></a>
    </div>
  </header>



  <!-- hero section -->
  <main class="flex flex-col">
    <section id="hero" class="flex flex-col gap-8 px-8 py-16 sm:py-20 md:py-24 max-w-[1000px] mx-auto w-full">
      <div class="text-center font-medium flex flex-col items-center gap-2">
        <h2 class="text-6xl sm:text-7xl md:text-8xl">Achievement Into Excellence</h2>
        <h4 class="text-4xl sm:text-5xl md:text-6xl">and beyond</h4>
      </div>
      <p class="text-center max-w-[600px] w-full mx-auto"><span class="font-semibold">Master Computer Science with personalized one-on-one mentoring.</span> Learn programming, problem-solving, web development, and essential CS concepts from an experienced mentor.</p>
      <div class="flex items-center gap-4 flex-wrap justify-center">
        <div class="tag rank px-2 py-0.5 sm:py-1.5 rounded-full sm:text-lg md:text-xl">Programming & CS</div>
        <div class="tag rank px-2 py-0.5 sm:py-1.5 rounded-full sm:text-lg md:text-xl">Years 10 - 22</div>
        <div class="tag rank px-2 py-0.5 sm:py-1.5 rounded-full sm:text-lg md:text-xl">In-person & Online</div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-8 w-fit mx-auto my-4">
        <a href="#what-i-teach"><button class="card-button-secondary px-4 py-2 rounded-full text-xl sm:text-2xl md:text-3xl">What I teach</button></a>
        <a href="#services"><button class="card-button-primary px-4 py-2 rounded-full text-xl sm:text-2xl md:text-3xl">Enquire Now</button></a>
      </div>
      <div class="w-fit mx-auto my-4 flex flex-col items-center gap-4">
        <p class="indie text-slate-600">Scroll for more</p>
        <div class="w-0.5 h-[100px] rounded-lg bg-linear-to-b from-slate-400 to-transparent"></div>
      </div>
    </section>

  
</body>

</html>
